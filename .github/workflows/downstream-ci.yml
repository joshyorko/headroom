name: Downstream CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEADROOM_OFFLINE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install focused test tools
        run: python -m pip install pytest PyYAML packaging
      - name: Check downstream deployment and workflow contracts
        run: |
          python -m pytest --noconftest -o addopts='' -q \
            tests/test_kamal_wrapper.py \
            tests/test_self_hosted_deploy_config.py \
            tests/test_release_workflows.py::test_downstream_ci_targets_main_and_keeps_upstream_suites_manual \
            tests/test_release_workflows.py::test_homebrew_dispatch_skips_without_pat_and_runs_when_configured \
            tests/test_release_workflows.py::test_only_the_root_cell_can_ever_publish_a_bare_latest_tag \
            scripts/tests/test_ci_workflow.py
