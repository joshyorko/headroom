name: Wrap E2E

on:
  # Broad upstream validation is opt-in in this downstream repository.
  workflow_dispatch:

concurrency:
  group: wrap-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docker-wrap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wrap e2e image
        run: docker build -f e2e/wrap/Dockerfile -t headroom-wrap-e2e .

      - name: Run wrap e2e container
        run: docker run --rm headroom-wrap-e2e
